<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <title>TaskX</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="titlebar">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".38" />
        <path d="M12 4.2l2.1 5.7 5.7 2.1-5.7 2.1L12 19.8l-2.1-5.7L4.2 12l5.7-2.1z" fill="currentColor" />
      </svg>
      <span class="appname">TaskX</span>
      <span class="tagline">Your work, in focus.</span>
      <button class="close" id="close" type="button" aria-label="Hide TaskX" title="Hide (Esc)">✕</button>
    </div>
    <main>
      <div class="toolbar">
        <button id="add" type="button">+ Add project</button>
      </div>
      <section class="panel">
        <h2 class="section-label" id="section-label">Next up</h2>
        <div id="empty">
          <p>Nothing here yet. Add a project to keep your next step in sight.</p>
          <button id="add-empty" type="button">+ Add project</button>
        </div>
        <ul id="list"></ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
