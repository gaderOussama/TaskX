<!doctype html>
<html lang="en" data-mode="circle">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <title>TaskX</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="panel" id="panel">
      <canvas id="aurora" aria-hidden="true"></canvas>
      <header class="bar">
        <button class="logo" id="logo" type="button" aria-label="Toggle TaskX" title="Toggle">
          <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".38" />
            <path d="M12 4.2l2.1 5.7 5.7 2.1-5.7 2.1L12 19.8l-2.1-5.7L4.2 12l5.7-2.1z" fill="currentColor" />
          </svg>
          <span class="appname">TaskX</span>
        </button>
        <div class="tools">
          <button class="icon-btn" id="add" type="button" aria-label="Add project" title="Add project (Ctrl+N)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5.5v13M5.5 12h13" />
            </svg>
          </button>
          <button class="icon-btn" id="pin" type="button" aria-pressed="false" aria-label="Pin open" title="Pin open">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 3.5h6l-1 5.5 3.2 3.2H6.8L10 9z" />
              <path d="M12 12.2V20" />
            </svg>
          </button>
          <button class="icon-btn" id="expand" type="button" aria-label="Open the dashboard" title="Open the dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14.5 9.5L19 5M19 5h-4M19 5v4" />
              <path d="M9.5 14.5L5 19M5 19h4M5 19v-4" />
            </svg>
          </button>
          <button class="icon-btn" id="collapse" type="button" aria-label="Collapse" title="Collapse (Esc)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14.5 6.5L9 12l5.5 5.5" />
            </svg>
          </button>
        </div>
      </header>

      <div class="panel-content">
        <section class="projects" aria-label="Projects">
          <ul id="list"></ul>
          <div id="empty" hidden>
            <p>No projects yet. Add one and keep your next step in sight.</p>
            <button id="add-empty" type="button">Add a project</button>
          </div>
        </section>

        <section class="detail" aria-label="Selected project">
          <h2 class="detail-name" id="detail-name"></h2>

          <h3 class="label">Next</h3>
          <div class="next-line">
            <button class="done" id="detail-done" type="button" aria-label="Mark next step done" title="Done"></button>
            <input id="detail-next" class="next" type="text" autocomplete="off" placeholder="what's next…" />
          </div>

          <h3 class="label">Log</h3>
          <ol class="log" id="log"></ol>

          <input id="quick" type="text" autocomplete="off" spellcheck="false" placeholder="What did you do?" />
        </section>
      </div>
    </div>
    <dialog id="ask">
      <form method="dialog">
        <p id="ask-text"></p>
        <div class="ask-actions">
          <button value="no" type="submit">Cancel</button>
          <button value="yes" type="submit" class="danger">Delete</button>
        </div>
      </form>
    </dialog>
    <script src="aurora.js"></script>
    <script src="app.js"></script>
  </body>
</html>
