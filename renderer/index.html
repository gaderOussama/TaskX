<!doctype html>
<html lang="en" data-mode="circle">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <title>TaskX</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="panel" id="panel">
      <canvas id="aurora" aria-hidden="true"></canvas>
      <header class="bar">
        <button class="logo" id="logo" type="button" aria-label="Toggle TaskX" title="Toggle">
          <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".38" />
            <path d="M12 4.2l2.1 5.7 5.7 2.1-5.7 2.1L12 19.8l-2.1-5.7L4.2 12l5.7-2.1z" fill="currentColor" />
          </svg>
          <span class="appname">TaskX</span>
        </button>
        <div class="tools">
          <button class="icon-btn" id="add" type="button" aria-label="Add project" title="Add project (Ctrl+N)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5.5v13M5.5 12h13" />
            </svg>
          </button>
          <button class="icon-btn" id="pin" type="button" aria-pressed="false" aria-label="Pin open" title="Pin open">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 3.5h6l-1 5.5 3.2 3.2H6.8L10 9z" />
              <path d="M12 12.2V20" />
            </svg>
          </button>
          <button class="icon-btn" id="recap-btn" type="button" aria-label="Copy a recap of your log" title="Copy a recap of your log">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 3.5h7.5L19 8v12.5H7z" />
              <path d="M10 12.5h6M10 16h6" />
            </svg>
          </button>
          <button class="icon-btn" id="expand" type="button" aria-label="Open the dashboard" title="Open the dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14.5 9.5L19 5M19 5h-4M19 5v4" />
              <path d="M9.5 14.5L5 19M5 19h4M5 19v-4" />
            </svg>
          </button>
          <button class="icon-btn" id="collapse" type="button" aria-label="Collapse" title="Collapse (Esc)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14.5 6.5L9 12l5.5 5.5" />
            </svg>
          </button>
        </div>
      </header>

      <div class="whisper" id="whisper">
        <span class="whisper-name" id="whisper-name"></span>
        <span class="whisper-text" id="whisper-text"></span>
      </div>

      <div class="panel-content">
        <div class="top">
          <input id="capture" type="text" autocomplete="off" spellcheck="false" placeholder="Capture a thought → Inbox" aria-label="Capture a thought" />
          <nav id="areas" aria-label="Areas" hidden></nav>
        </div>

        <section class="projects" aria-label="Projects">
          <button id="inbox-row" type="button" title="Open the inbox" hidden></button>
          <ul id="list"></ul>
          <div id="empty" hidden>
            <p>No projects yet. Add one and keep your next step in sight.</p>
            <button id="add-empty" type="button">Add a project</button>
          </div>
        </section>

        <section class="detail" aria-label="Selected project" data-view="project">
          <h2 class="detail-name" id="detail-name"></h2>

          <ul class="inbox-list" id="inbox-list" tabindex="-1"></ul>

          <input id="detail-area" type="text" list="areas-list" autocomplete="off" placeholder="area, e.g. work" title="Groups projects into tabs" aria-label="Area" />
          <datalist id="areas-list"></datalist>
          <textarea id="detail-note" rows="1" spellcheck="false" placeholder="What it is · how to run it · why" aria-label="Note"></textarea>

          <p class="welcome" id="welcome" hidden></p>
          <h3 class="label">Next</h3>
          <div class="next-line">
            <button class="done" id="detail-done" type="button" aria-label="Mark next step done" title="Done"></button>
            <input id="detail-next" class="next" type="text" autocomplete="off" placeholder="what's next…" />
          </div>

          <details id="ideas">
            <summary class="label" id="ideas-sum">Ideas</summary>
            <ul class="ideas-list" id="ideas-list"></ul>
            <input id="idea" type="text" autocomplete="off" placeholder="An idea for later…" aria-label="An idea for later" />
          </details>

          <h3 class="label">Log</h3>
          <ol class="log" id="log"></ol>

          <input id="quick" class="boxed" type="text" autocomplete="off" spellcheck="false" placeholder="What did you do?" />
        </section>
      </div>
    </div>
    <dialog id="ask">
      <form method="dialog">
        <p id="ask-text"></p>
        <div class="ask-actions">
          <button value="no" type="submit">Cancel</button>
          <button value="yes" type="submit" class="danger">Delete</button>
        </div>
      </form>
    </dialog>
    <dialog id="recap">
      <form method="dialog">
        <p id="recap-text"></p>
        <div class="ask-actions">
          <button type="button" id="recap-today">Copy today</button>
          <button type="button" id="recap-week">Copy this week</button>
          <button value="no" type="submit">Close</button>
        </div>
      </form>
    </dialog>
    <script src="aurora.js"></script>
    <script src="app.js"></script>
  </body>
</html>
